name: App Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm install

      - name: Preparar la app web
        run: npm run www

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Íconos
        continue-on-error: true
        run: |
          mkdir -p assets
          cp android-assets/icon-1024.png assets/icon-only.png
          cp android-assets/icon-fg.png assets/icon-foreground.png
          cp android-assets/icon-bg.png assets/icon-background.png
          npx @capacitor/assets generate --android

      - name: Permisos de alarmas exactas
        run: |
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />#' android/app/src/main/AndroidManifest.xml
          grep -n "permission" android/app/src/main/AndroidManifest.xml

      - name: Sincronizar
        run: npx cap sync android

      - name: Firma fija (para poder actualizar sin desinstalar)
        run: |
          mkdir -p ~/.android
          cp android-assets/debug.keystore ~/.android/debug.keystore

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../rutina-ricky.apk

      - uses: actions/upload-artifact@v4
        with:
          name: rutina-ricky-apk
          path: rutina-ricky.apk

      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Rutina Ricky ${{ github.run_number }}
          make_latest: true
          files: rutina-ricky.apk
          body: Descargá rutina-ricky.apk desde el celular e instalalo.
