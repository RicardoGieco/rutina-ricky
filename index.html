<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2246D6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rutina">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Rutina Ricky</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: una columna tipo app de celular; cabecera con racha y puntos, pestañas fijas abajo */
:root{
  --bg:#F1F3F0; --surface:#FFFFFF; --sunk:#E6EAE6; --fg:#131B18; --muted:#5B6863; --line:#D7DDD8;
  --accent:#2246D6; --accent-soft:#E3E9FF; --on-accent:#FFFFFF; --gold:#A86F00; --ok:#258C55; --late:#C2512F;
  --a-fuerza:#2246D6; --a-cardio:#D0492F; --a-comida:#258C55; --a-kegel:#7350CF; --a-descanso:#46678A; --a-estudio:#A86F00; --a-habitos:#16807F; --a-movilidad:#B0447A;
  --display:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:18px; --tabs-h:68px; --ring-track:#DCE2DE;
  --on-ok:#FFFFFF; --hero-a:#1B2F8F; --hero-b:#2246D6; --hero-fg:#FFFFFF; --hero-ring:#FFD166;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1214; --surface:#162024; --sunk:#10181B; --fg:#E7EEEA; --muted:#91A19B; --line:#25323A;
  --accent:#7A93FF; --accent-soft:#1E2A52; --on-accent:#0D1214; --gold:#E2B24A; --ok:#4FC283; --late:#F08465;
  --a-fuerza:#7A93FF; --a-cardio:#F08465; --a-comida:#4FC283; --a-kegel:#AE92FF; --a-descanso:#8FAACB; --a-estudio:#E2B24A; --a-habitos:#4CC8C6; --a-movilidad:#E57FB2; --ring-track:#26333A;
  --on-ok:#0D1214; --hero-a:#16245F; --hero-b:#2A3FA8; --hero-fg:#F2F5FF; --hero-ring:#FFD166;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1214; --surface:#162024; --sunk:#10181B; --fg:#E7EEEA; --muted:#91A19B; --line:#25323A;
  --accent:#7A93FF; --accent-soft:#1E2A52; --on-accent:#0D1214; --gold:#E2B24A; --ok:#4FC283; --late:#F08465;
  --a-fuerza:#7A93FF; --a-cardio:#F08465; --a-comida:#4FC283; --a-kegel:#AE92FF; --a-descanso:#8FAACB; --a-estudio:#E2B24A; --a-habitos:#4CC8C6; --a-movilidad:#E57FB2; --ring-track:#26333A;
  --on-ok:#0D1214; --hero-a:#16245F; --hero-b:#2A3FA8; --hero-fg:#F2F5FF; --hero-ring:#FFD166;
  color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;margin:0;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--tabs-h) + 24px + env(safe-area-inset-bottom,0px))}

/* Cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.brand{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.phase{font-size:12px;color:var(--muted);margin-top:3px}
.stats{display:flex;gap:6px;flex-shrink:0}
.stat{display:flex;flex-direction:column;align-items:flex-end;padding:4px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.stat b{font-family:var(--display);font-size:20px;line-height:1;font-weight:700}
.stat span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat.gold b{color:var(--gold)}

h2{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
h3{font-size:15px;margin:0;font-weight:600}
.section{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.hint{font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}

/* Navegación de días */
.daynav{display:flex;align-items:center;gap:8px;margin-top:14px}
.daynav .label{flex:1;font-family:var(--display);font-size:26px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;line-height:1.05}
.daynav .label small{display:block;font-family:var(--body);font-size:13px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted)}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex-shrink:0}
.iconbtn svg{width:18px;height:18px}
.pill-btn{height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}

/* Resumen del día */
.hero{display:flex;gap:16px;align-items:center;padding:16px;margin-top:14px}
.ring{width:84px;height:84px;flex-shrink:0;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:26px}
.hero-text{min-width:0;display:flex;flex-direction:column;gap:4px}
.hero-text .msg{font-weight:600;font-size:16px;line-height:1.3}
.hero-text .quote{font-size:13px;color:var(--muted);font-style:italic}
.areas{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));flex-shrink:0}
.chip.full{border-color:var(--c);}

/* Lista de tareas */
.tasks{display:flex;flex-direction:column;gap:8px}
.task{display:grid;grid-template-columns:52px 1fr 44px;gap:10px;align-items:center;padding:12px 12px 12px 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);position:relative}
.task::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--c)}
.task .time{font-family:var(--display);font-weight:600;font-size:19px;text-align:center}
.task .body{min-width:0}
.task .title{font-weight:600}
.task .detail{font-size:13px;color:var(--muted);margin-top:1px}
.task .actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.task .mini{font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--sunk)}
.task.done{background:var(--sunk)}
.task.done .title{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.task.next{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:2px}
.tag.next{background:var(--accent);color:var(--on-accent)}
.tag.late{color:var(--late);border:1px solid var(--late)}
.check{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:transparent;display:grid;place-items:center;transition:background .15s,border-color .15s}
.check svg{width:20px;height:20px;opacity:0;transition:opacity .15s;stroke:var(--on-accent)}
.check.on{background:var(--c,var(--accent));border-color:var(--c,var(--accent))}
.check.on svg{opacity:1}
.habits{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.habit{display:flex;gap:10px;align-items:center;text-align:left;padding:10px 12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:500;line-height:1.3}
.habit .check{width:28px;height:28px;border-radius:9px;flex-shrink:0;--c:var(--a-habitos)}
.habit .check svg{width:16px;height:16px}
.habit.on{background:var(--sunk);color:var(--muted)}

/* Gimnasio */
.daychips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.daychip{flex:1;min-width:44px;padding:8px 0;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:1px}
.daychip small{font-size:10.5px;font-weight:500;color:var(--muted)}
.daychip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.daychip.on small{color:var(--bg);opacity:.75}
.banner{padding:10px 12px;border-radius:12px;background:var(--accent-soft);font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.plain{background:var(--sunk)}
.ex{padding:14px;display:flex;flex-direction:column;gap:10px}
.ex-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ex-name{font-weight:700;font-size:16px;line-height:1.25}
.ex-meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.ex-note{font-size:12.5px;color:var(--muted);border-left:2px solid var(--line);padding-left:8px}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.badge.ss{background:var(--accent-soft);color:var(--accent)}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:34px 54px 1fr 40px;gap:8px;align-items:center}
.set .n{font-size:12px;color:var(--muted);font-weight:600}
.set .reps{font-family:var(--display);font-size:19px;font-weight:600}
.set .reps small{font-family:var(--body);font-size:11px;color:var(--muted);font-weight:500}
.wt{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--sunk);height:40px;overflow:hidden;min-width:0}
.wt button{width:36px;height:100%;border:0;background:transparent;font-size:18px;font-weight:600;color:var(--muted);flex-shrink:0}
.wt input{flex:1;min-width:0;width:100%;border:0;background:transparent;text-align:center;font-family:var(--display);font-size:20px;font-weight:700;padding:0;-moz-appearance:textfield}
.wt input::-webkit-outer-spin-button,.wt input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.wt .unit{font-size:11px;color:var(--muted);padding-right:8px;white-space:nowrap}
.set .check{width:40px;height:40px;--c:var(--a-fuerza)}
.set.bw{grid-template-columns:34px 54px 1fr 40px}
.bwlabel{font-size:13px;color:var(--muted)}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14.5px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.small{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.wide{width:100%}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.group-label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:6px 2px -2px}

/* Comidas */
.meal{padding:14px;display:grid;grid-template-columns:70px 1fr;gap:4px 12px}
.meal .mt{font-family:var(--display);font-weight:700;font-size:18px;text-transform:uppercase;grid-row:span 2}
.meal .mb{font-weight:600}
.meal .mv{font-size:13px;color:var(--muted)}
.shop{padding:6px 14px}
.shop-cat{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
.shop-item{display:flex;align-items:center;gap:10px;padding:7px 0;border:0;background:none;width:100%;text-align:left;font-size:14.5px}
.shop-item .check{width:26px;height:26px;border-radius:8px;--c:var(--a-comida)}
.shop-item .check svg{width:15px;height:15px}
.shop-item.on span{text-decoration:line-through;color:var(--muted)}
.note{padding:12px 14px;font-size:13.5px}
.note b{font-weight:700}

/* Progreso */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{padding:12px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--display);font-size:30px;line-height:1;font-weight:700}
.kpi span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.level{padding:14px;display:flex;flex-direction:column;gap:8px}
.bar{height:10px;border-radius:999px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:999px}
.chart{padding:12px 12px 8px}
.chart svg{width:100%;height:auto;display:block}
.area-row{display:grid;grid-template-columns:110px 1fr 40px;gap:10px;align-items:center;font-size:13.5px}
.weeks{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.wk{height:30px;border-radius:6px;background:var(--sunk);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--muted)}
.wk.past{background:var(--accent-soft);color:var(--accent)}
.wk.now{background:var(--accent);color:var(--on-accent)}
.months{display:grid;grid-template-columns:4fr 4fr 4fr;gap:4px;font-size:11px;color:var(--muted);text-align:center}
.empty{padding:20px 14px;text-align:center;color:var(--muted);font-size:13.5px}
select{height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 10px;max-width:100%}

/* Alarmas */
.al-row{display:grid;grid-template-columns:92px 1fr 52px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.al-row:last-child{border-bottom:0}
.al-row input[type=time]{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);padding:0 6px;width:100%;font-variant-numeric:tabular-nums}
.al-row .t{font-size:14px;font-weight:500;min-width:0}
.toggle{width:48px;height:28px;border-radius:999px;background:var(--line);border:0;position:relative;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.toggle.on{background:var(--ok)}
.toggle.on::after{transform:translateX(20px)}
textarea{width:100%;min-height:90px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);padding:10px;font-size:12px;font-family:ui-monospace,Menlo,monospace}

/* Agua, proteína, cierre, resumen, cuerpo */
.fuel{padding:14px;display:flex;flex-direction:column;gap:10px}
.fuel-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.fuel-sep{height:1px;background:var(--line);margin:2px 0}
.big{font-family:var(--display);font-size:28px;font-weight:700;line-height:1}
.stepper{display:flex;align-items:center;gap:10px}
.stepper b{font-family:var(--display);font-size:26px;min-width:26px;text-align:center}
.stepper .iconbtn{font-size:20px;font-weight:600}
.glasses{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.glasses i{height:16px;border-radius:4px;background:var(--sunk);border:1px solid var(--line)}
.glasses i.on{background:var(--a-descanso);border-color:var(--a-descanso)}
.prot-btns{display:flex;flex-wrap:wrap;gap:6px}
.mini-btn{padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);font-size:13px;font-weight:500}
.mini-btn b{color:var(--a-comida)}
.prot-custom{display:flex;gap:8px;align-items:center}
.prot-custom .wt{flex:1}
.prot-custom .wt input{font-family:var(--body);font-size:15px;font-weight:500;text-align:left;padding-left:12px}
.rate-row{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center;font-weight:600;font-size:14px}
.rate{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rate button{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);font-family:var(--display);font-size:19px;font-weight:700}
.rate button.on{background:var(--a-kegel);border-color:var(--a-kegel);color:var(--on-accent)}
.sum{padding:14px;display:flex;flex-direction:column;gap:14px}
.sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 8px}
.sum-grid div{display:flex;flex-direction:column}
.sum-grid b{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.05}
.sum-grid span{font-size:11px;color:var(--muted);letter-spacing:.04em}
.sum-list{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg button{height:34px;border:0;border-radius:9px;background:transparent;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos button{border:0;padding:0;background:none;position:relative;border-radius:10px;overflow:hidden;aspect-ratio:3/4;max-width:100%}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos span{position:absolute;left:4px;bottom:4px;font-size:11px;font-weight:700;background:var(--surface);color:var(--fg);padding:1px 6px;border-radius:6px}
.feel{display:grid;grid-template-columns:60px repeat(14,minmax(14px,1fr));gap:4px;align-items:center;min-width:300px}
.feel i{height:20px;border-radius:4px}
.feel .fl{font-size:12px;font-weight:600}
.feel .fd{font-size:10px;color:var(--muted);text-align:center}
.iconbtn:disabled{opacity:.35}

/* Rediseño */
body{background:radial-gradient(1200px 500px at 50% -200px,var(--accent-soft),transparent 70%),var(--bg);background-attachment:fixed}
.top{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.stat{flex-direction:row;align-items:center;gap:6px;padding:5px 10px 5px 8px}
.stat>div{display:flex;flex-direction:column;align-items:flex-start}
.si svg{width:18px;height:18px;display:block}
.daynav .label{font-size:30px}
.week{display:grid;grid-template-columns:28px repeat(7,1fr) 28px;gap:2px;align-items:center;margin-top:10px}
.wk-arrow{border:0;background:none;color:var(--muted);height:52px;display:grid;place-items:center;padding:0}
.wk-arrow svg{width:18px;height:18px}
.wd{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:14px;color:var(--fg)}
.wd span{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.wd svg{width:36px;height:36px}
.wd.today span{color:var(--accent)}
.wd.on{background:var(--surface);box-shadow:0 1px 0 var(--line),0 4px 14px rgba(20,30,60,.08);outline:1px solid var(--line)}
.hero{margin-top:12px;padding:18px;border-radius:22px;background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:var(--hero-fg);display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px rgba(34,70,214,.25);border:0}
.hero-top{display:flex;gap:16px;align-items:center}
.hero .ring svg circle:first-child{stroke:rgba(255,255,255,.18)}
.hero .ring .pct{color:var(--hero-fg);font-size:28px}
.hero .ring .pct small{font-size:14px;margin-left:1px;opacity:.8}
.greet{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.hero .msg{font-size:17px;font-weight:600;line-height:1.3}
.hero .quote{font-size:13px;opacity:.8;font-style:italic;color:var(--hero-fg)}
.upnext{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;background:rgba(255,255,255,.12);border-radius:14px;padding:10px 12px}
.upnext .ic{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.95);color:var(--c);display:grid;place-items:center}
.upnext .ic svg{width:20px;height:20px}
.upnext small{display:block;font-size:11.5px;opacity:.8;font-weight:500}
.upnext b{font-size:15px;font-weight:600;display:block;line-height:1.25}
.upnext .t{font-family:var(--display);font-size:22px;font-weight:700}
.chip svg{width:14px;height:14px;color:var(--c)}
.chip.full{background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.task{grid-template-columns:44px 1fr 44px;padding:12px;border-color:transparent;box-shadow:0 1px 2px rgba(10,20,30,.05),0 0 0 1px var(--line)}
.task::before{display:none}
.task .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,var(--surface));color:var(--c)}
.task .ic svg{width:22px;height:22px}
.task .time{font-family:var(--body);font-size:11.5px;font-weight:600;color:var(--c);text-align:left;letter-spacing:.02em;margin-bottom:1px}
.task.done{background:transparent;box-shadow:0 0 0 1px var(--line);opacity:.62}
.task.done .ic{background:var(--sunk);color:var(--muted)}
.task.next{box-shadow:0 0 0 2px var(--accent),0 8px 20px rgba(34,70,214,.15)}
.check{border-radius:50%}
.habit .check,.shop-item .check{border-radius:8px}
.badge.ok{background:color-mix(in srgb,var(--ok) 18%,var(--surface));color:var(--ok)}
.bar.thin{height:5px}
.ex.exdone{opacity:.7}
.tabs{background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tab-ic{display:grid;place-items:center;width:56px;height:30px;border-radius:999px;transition:background .15s}
.tab.on .tab-ic{background:var(--accent-soft)}

.brand{font-size:22px;white-space:nowrap}
.phase{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top>div:first-child{min-width:0;flex:1}
.ring .pct{display:flex;align-items:baseline;justify-content:center;place-items:unset;align-content:center}
.ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.section-head .hint{white-space:nowrap}

/* Calendario del mes */
.month{padding:14px;display:flex;flex-direction:column;gap:12px}
.mstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mstats div{display:flex;flex-direction:column}
.mstats b{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.05}
.mstats span{font-size:10.5px;color:var(--muted);line-height:1.2}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.mh{font-size:11px;font-weight:700;color:var(--muted);text-align:center}
.mc{aspect-ratio:1;max-width:100%;border:0;border-radius:10px;background:var(--sunk);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:0;color:var(--fg)}
.mc.empty{background:transparent}
.mc.future{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.mc .mn{position:absolute;top:3px;left:5px;font-size:10px;font-weight:600;opacity:.75}
.mc .mp{font-family:var(--display);font-size:17px;font-weight:700;margin-top:6px}
.mc.today{box-shadow:inset 0 0 0 2px var(--accent)}
.mc.open .mp{opacity:.5}
.mc .mdot{position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.7}
.l1,.mlegend i.l1{background:color-mix(in srgb,var(--ok) 20%,var(--surface))}
.l2,.mlegend i.l2{background:color-mix(in srgb,var(--ok) 42%,var(--surface))}
.l3,.mlegend i.l3{background:color-mix(in srgb,var(--ok) 68%,var(--surface));color:var(--on-ok)}
.l4,.mlegend i.l4{background:var(--ok);color:var(--on-ok)}
.mc.l1,.mc.l2{color:var(--fg)}
.mlegend{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.mlegend i{width:14px;height:14px;border-radius:4px;background:var(--sunk)}
.dlist{display:flex;flex-direction:column;gap:4px}
.dlist div{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;font-size:13.5px;color:var(--muted)}
.dlist div.ok{color:var(--fg)}
.dlist .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,var(--surface));color:var(--c)}
.dlist .ic svg{width:16px;height:16px}
.dlist div.ok b{color:var(--ok)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:8px}
.dgrid div{background:var(--sunk);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column}
.dgrid b{font-family:var(--display);font-size:20px;font-weight:700}
.dgrid span{font-size:11px;color:var(--muted)}

/* Pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabs-h)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent)}

/* Descanso, modal, aviso */
.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabs-h) + 12px + env(safe-area-inset-bottom,0px));z-index:11;background:var(--fg);color:var(--bg);border-radius:999px;padding:8px 8px 8px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 6px 24px rgba(0,0,0,.25);width:max-content;max-width:calc(100% - 32px)}
.rest b{font-family:var(--display);font-size:24px;font-weight:700}
.rest span{font-size:13px;opacity:.8}
.rest button{height:34px;padding:0 14px;border-radius:999px;border:0;background:var(--bg);color:var(--fg);font-weight:600;font-size:13px}
.modal{position:fixed;inset:0;z-index:20;background:rgba(5,10,12,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:92%;overflow-y:auto}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.kg-phase{font-family:var(--display);font-size:44px;font-weight:700;text-transform:uppercase;text-align:center;line-height:1}
.kg-sub{text-align:center;color:var(--muted);font-size:14px;min-height:20px}
.kg-count{text-align:center;font-family:var(--display);font-size:64px;font-weight:700;line-height:1;color:var(--a-kegel)}
.kg-steps{font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.2)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40;width:100%;height:100%}
@media (max-width:380px){.habits{grid-template-columns:1fr}.set{grid-template-columns:30px 48px 1fr 40px}.stat{padding:4px 8px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- Tareas del día ---------- */
function tasksFor(ds){
  const d=dow(ds),km=kegelMonth(ds),out=[];
  for(const t of TASKS){
    let base=t.times[d];if(!base)continue;
    let title=t.title,detail=t.detail,area=t.area;
    if(t.kegel){base=KEGEL_INFO[km].time;title='Kegel inverso · mes '+km;detail=KEGEL_INFO[km].where}
    if(t.gym){const w=WORKOUTS[d];title=d===3?w.title:'Fuerza: '+w.title.toLowerCase();detail=d===3?'Resistencia media a alta, después movilidad':'Calentamiento 10 · fuerza 75–80 · cinta 30 · vuelta a la calma 10';if(d===3)area='cardio'}
    const time=(S.ov[t.id+':'+d])||base;
    out.push({id:t.id,title,detail,area,pts:t.pts,time,gym:t.gym,kegel:t.kegel,close:t.close,alarm:!S.off[t.id+':'+d]});
  }
  return out.sort((a,b)=>a.time.localeCompare(b.time));
}
const isDone=(ds,id)=>!!(S.checks[ds]&&S.checks[ds][id]);
function setDone(ds,id,v){S.checks[ds]=S.checks[ds]||{};if(v)S.checks[ds][id]=1;else delete S.checks[ds][id];save()}
function dayStats(ds){
  const ts=tasksFor(ds);let total=0,done=0;const areas={};
  const add=(a,p,ok)=>{areas[a]=areas[a]||{t:0,d:0,n:0,nd:0};areas[a].t+=p;areas[a].n++;total+=p;if(ok){areas[a].d+=p;areas[a].nd++;done+=p}};
  ts.forEach(t=>add(t.area,t.pts,isDone(ds,t.id)));
  HABITS.forEach(h=>add('habitos',5,isDone(ds,h.id)));
  return {total,done,pct:total?Math.round(done/total*100):0,areas,tasks:ts};
}
function totals(){
  let pts=0;
  for(const ds in S.checks){const st=dayStats(ds);pts+=st.done+(st.pct===100?20:0)}
  // racha: días seguidos con 80% o más
  let streak=0,cur=today();
  if(dayStats(cur).pct<80)cur=addDays(cur,-1);
  while(S.checks[cur]&&dayStats(cur).pct>=80){streak++;cur=addDays(cur,-1)}
  let best=0,run=0;const days=Object.keys(S.checks).sort();
  if(days.length){for(let d=days[0];d<=today();d=addDays(d,1)){if(S.checks[d]&&dayStats(d).pct>=80){run++;best=Math.max(best,run)}else run=0}}
  return {pts,streak,best:Math.max(best,streak)};
}
function levelOf(p){let i=0;for(let k=0;k<LEVELS.length;k++)if(p>=LEVELS[k][0])i=k;const next=LEVELS[i+1];return {name:LEVELS[i][1],idx:i+1,from:LEVELS[i][0],to:next?next[0]:null,nextName:next?next[1]:null}}

function weightOf(ds,e,i,log){

  if(s&&s.w&&s.w[i]!=null)return s.w[i];

  return e.w[i];

/* ---------- Resumen de la semana ---------- */
function exMaxBefore(id,before){let m=null;for(const d in S.gym){if(d>=before)continue;const s=S.gym[d].ex[id];if(s&&s.w&&s.d)s.w.forEach((v,i)=>{if(s.d[i]&&v!=null)m=Math.max(m??0,v)})}return m}
function weekSummary(wk){
  const td=today(),days=[];for(let i=0;i<7;i++){const d=addDays(wk,i);if(d<=td)days.push(d)}
  const end=addDays(wk,7);
  const r={days:days.length,pts:0,ok:0,pct:0,gym:0,bici:0,kegel:0,cuello:0,pasos:false,prot:[],water:[],rates:{sleep:[],energy:[],mood:[]},records:[],tips:[]};
  days.forEach(d=>{const st=dayStats(d);r.pts+=st.done+(st.pct===100?20:0);r.pct+=st.pct;if(st.pct>=80)r.ok++;
    const dw=dow(d);if(isDone(d,'entreno')){if(dw===3)r.bici++;else r.gym++}if(isDone(d,'kegel'))r.kegel++;if(isDone(d,'cuello'))r.cuello++;if(isDone(d,'pasos'))r.pasos=true;
    if(S.prot[d]&&S.prot[d].length)r.prot.push(protOf(d));if(S.water[d])r.water.push(S.water[d]);
    const c=S.close[d];if(c)RATE.forEach(([k])=>{if(c[k])r.rates[k].push(c[k])})});
  r.pct=days.length?Math.round(r.pct/days.length):0;
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  r.protAvg=avg(r.prot);r.waterAvg=avg(r.water);
  RATE.forEach(([k])=>r.rates[k]=avg(r.rates[k]));
  // peso corporal
  const bd=Object.keys(S.body).filter(d=>S.body[d].w).sort();
  const inW=bd.filter(d=>d>=wk&&d<end),prev=bd.filter(d=>d<wk);
  if(inW.length){r.weight=S.body[inW[inW.length-1]].w;if(prev.length)r.wDelta=Math.round((r.weight-S.body[prev[prev.length-1]].w)*10)/10}
  // récords
  ALL_EX.forEach(e=>{let m=null;for(const d in S.gym){if(d<wk||d>=end)continue;const s=S.gym[d].ex[e.id];if(s&&s.w&&s.d)s.w.forEach((v,i)=>{if(s.d[i]&&v!=null)m=Math.max(m??0,v)})}
    if(m==null)return;const b=exMaxBefore(e.id,wk);if(b!=null&&m>b)r.records.push(e.n+': '+fmtKg(m)+' '+(e.u==='lado'?'kg/lado':'kg')+' (antes '+fmtKg(b)+')')});
  // qué ajustar
  [EX[1][0],EX[4][0]].forEach(e=>{const lf=lastFullSession(e);if(lf&&lf>=wk&&lf<end&&S.prog[e.id]!==lf)r.tips.push('Completaste todas las repeticiones en '+e.n.toLowerCase()+': subí '+fmtKg(e.inc)+' kg por lado.')});
  let cin=0;days.forEach(d=>{const g=S.gym[d];if(g&&g.cardio&&g.cardio.incl!=null)cin++});
  const inc=(S.cardio.cinta&&S.cardio.cinta.incl)||8;
  if(cin>=3&&inc<12)r.tips.push('Hiciste la cinta '+cin+' veces: si terminaste entero, subí la inclinación a '+(inc+1)+' %.');
  if(r.protAvg!=null&&r.protAvg<PROT_GOAL)r.tips.push('Promediaste '+Math.round(r.protAvg)+' g de proteína: agrandá las porciones de pollo o pescado, o sumá huevos.');
  if(r.rates.sleep!=null&&r.rates.sleep<3)r.tips.push('Dormiste mal varios días: priorizá estar en la cama a las 23:00.');
  if(days.length===7&&r.kegel<5)r.tips.push('Kegel: '+r.kegel+' de 5 esta semana. Sostener la frecuencia es lo que da resultado.');
  if(days.length===7&&r.gym<4)r.tips.push('Fuerza: '+r.gym+' de 4 sesiones. La semana que viene, apuntá a las 4.');
  return r;
}
function summaryHTML(){
  const td=today();if(!UI.sumWeek)UI.sumWeek=weekKey(td);const wk=UI.sumWeek,r=weekSummary(wk);
  const f=v=>v==null?'–':fmtKg(Math.round(v*10)/10);
  let h='<div class="section" id="summary"><div class="section-head"><h2>Resumen de la semana</h2></div><div class="daynav" style="margin-top:0"><button class="iconbtn" data-act="sumPrev" aria-label="Semana anterior">'+CHEV_L+'</button><div class="label" style="font-size:20px">'+fmtShort(wk)+' al '+fmtShort(addDays(wk,6))+'<small>'+(wk>=PLAN.start&&wk<=PLAN.end?'Semana '+planWeek(wk)+' de 12':'Fuera del plan')+'</small></div><button class="iconbtn" data-act="sumNext" aria-label="Semana siguiente"'+(wk>=weekKey(td)?' disabled':'')+'>'+CHEV_R+'</button></div>';
  if(!r.days){return h+'<div class="card empty">Esta semana todavía no empezó.</div></div>'}
  h+='<div class="card sum"><div class="sum-grid">';
  const cell=(v,l)=>'<div><b class="num">'+v+'</b><span>'+l+'</span></div>';
  h+=cell(r.pct+'%','cumplimiento')+cell(r.pts,'puntos')+cell(r.ok+'/'+r.days,'días al 80 %')+cell(r.gym+'/4','fuerza')+cell(r.bici+'/1','bici')+cell(r.kegel+'/5','Kegel')+cell(r.cuello+'/'+r.days,'cuello')+cell(r.protAvg==null?'–':Math.round(r.protAvg)+' g','proteína prom.')+cell(r.waterAvg==null?'–':f(r.waterAvg),'vasos de agua')+cell(r.weight==null?'–':f(r.weight)+' kg','peso')+cell(r.wDelta==null?'–':(r.wDelta>0?'+':'')+f(r.wDelta)+' kg','vs. semana ant.')+cell(f(r.rates.sleep),'sueño prom.');
  h+='</div>';
  if(r.records.length)h+='<div><h3>Récords de peso</h3><ul class="sum-list">'+r.records.map(x=>'<li>'+x+'</li>').join('')+'</ul></div>';
  h+='<div><h3>Para la semana que viene</h3>'+(r.tips.length?'<ul class="sum-list">'+r.tips.map(x=>'<li>'+x+'</li>').join('')+'</ul>':'<div class="hint">Nada para ajustar: seguí así.</div>')+'</div>';
  return h+'</div></div>';
}

/* ---------- Calendario del mes ---------- */
const MON_LVL=p=>p>=90?4:p>=75?3:p>=50?2:p>0?1:0;

  let tot=0,cnt=0,ok=0,best=null,cells='';
  for(let i=0;i<lead;i++)cells+='<span class="mc empty"></span>';
  for(let dd=1;dd<=nd;dd++){
    const d=y+'-'+pad(m)+'-'+pad(dd),has=!!S.checks[d],closed=isDone(d,'cierre');

  const lp=lv.to?Math.round((t.pts-lv.from)/(lv.to-lv.from)*100):100;
  h+='<div class="card level"><div class="section-head"><h3>Nivel '+lv.idx+' · '+lv.name+'</h3><span class="hint num">'+(lv.to?(lv.to-t.pts)+' pts para '+lv.nextName:'Nivel máximo')+'</span></div><div class="bar" style="--c:var(--gold)"><i style="width:'+lp+'%"></i></div><div class="hint">La racha cuenta los días seguidos con 80 % o más. Un día completo suma 20 pts de bonus.</div></div></div>';

  svg+='</svg>';
  h+='<div class="section"><div class="section-head"><h2>Últimos 14 días</h2><span class="hint">azul: 80 % o más</span></div><div class="card chart">'+svg+'</div></div>';
  // áreas de la semana
  const wk=weekKey(td);const agg={};
  for(let i=0;i<7;i++){const d=addDays(wk,i);if(d>td)break;const st=dayStats(d);for(const a in st.areas){agg[a]=agg[a]||{t:0,d:0};agg[a].t+=st.areas[a].t;agg[a].d+=st.areas[a].d}}
  h+='<div class="section"><div class="section-head"><h2>Esta semana por área</h2></div><div class="card" style="padding:14px;display:flex;flex-direction:column;gap:10px">';
  for(const a in AREAS){if(!agg[a])continue;const p=Math.round(agg[a].d/agg[a].t*100);h+='<div class="area-row"><span>'+AREAS[a]+'</span><div class="bar" style="--c:'+AC(a)+'"><i style="width:'+p+'%"></i></div><b class="num" style="text-align:right">'+p+'%</b></div>'}
  h+='</div></div>';
  // pesos
  const ex=ALL_EX.find(e=>e.id===UI.chartEx)||ALL_EX[0];
  const pts=Object.keys(S.gym).sort().map(d=>{const s=S.gym[d].ex[ex.id];if(!s||!s.w||!s.d)return null;let m=null;s.w.forEach((v,i)=>{if(s.d[i]&&v!=null)m=Math.max(m??0,v)});return m==null?null:{d,v:m}}).filter(Boolean);
  h+='<div class="section"><div class="section-head"><h2>Evolución de pesos</h2></div><select id="chartEx" aria-label="Ejercicio">'+ALL_EX.map(e=>'<option value="'+e.id+'"'+(e.id===ex.id?' selected':'')+'>'+e.n+'</option>').join('')+'</select>';
  if(pts.length<1)h+='<div class="card empty">Cuando tildes series en el gimnasio vas a ver acá el peso más alto de cada sesión de '+ex.n.toLowerCase()+'.</div>';
  else h+='<div class="card chart">'+lineChart(pts,ex.u==='lado'?'kg/lado':'kg')+'</div>';
  h+='</div>';
  // plan
  const cw=td<PLAN.start?0:planWeek(td);
  h+='<div class="section"><div class="section-head"><h2>Plan de 12 semanas</h2><span class="hint">5/10 al 27/12</span></div><div class="card" style="padding:14px;display:flex;flex-direction:column;gap:6px"><div class="weeks">';
  for(let i=1;i<=12;i++)h+='<div class="wk num'+(i<cw?' past':i===cw?' now':'')+'">'+i+'</div>';
  h+='</div><div class="months"><span>Kegel 1 · acostado</span><span>Kegel 2 · sentado</span><span>Kegel 3 · dinámico</span></div></div></div>';
  $('#v-progreso').innerHTML=h;
}
function lineChart(pts,unit){
  const W=320,H=150,L=34,R=12,T=14,B=24;
  let lo=Math.min(...pts.map(p=>p.v)),hi=Math.max(...pts.map(p=>p.v));
  if(lo===hi){lo-=5;hi+=5}
  const pad2=(hi-lo)*.15;lo=Math.max(0,lo-pad2);hi+=pad2;
  const x=i=>pts.length===1?(L+(W-L-R)/2):L+i*(W-L-R)/(pts.length-1);
  const y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolución del peso">';
  [lo,(lo+hi)/2,hi].forEach(v=>{s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(y(v)+3)+'" text-anchor="end" font-size="9" fill="var(--muted)" font-family="Figtree,sans-serif">'+fmtKg(Math.round(v*10)/10)+'</text>'});
  const path=pts.map((p,i)=>(i?'L':'M')+x(i)+' '+y(p.v)).join(' ');
  s+='<path d="'+path+' L'+x(pts.length-1)+' '+(H-B)+' L'+x(0)+' '+(H-B)+' Z" fill="var(--accent)" opacity=".12"/>';
  s+='<path d="'+path+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>';
  pts.forEach((p,i)=>{const last=i===pts.length-1;s+='<circle cx="'+x(i)+'" cy="'+y(p.v)+'" r="'+(last?4.5:3)+'" fill="'+(last?'var(--accent)':'var(--surface)')+'" stroke="var(--accent)" stroke-width="2"/>'});
  const lp=pts[pts.length-1];
  s+='<text x="'+Math.min(x(pts.length-1),W-R-30)+'" y="'+(y(lp.v)-9)+'" text-anchor="middle" font-size="11" font-weight="700" fill="var(--fg)" font-family="Figtree,sans-serif">'+fmtKg(lp.v)+' '+unit+'</text>';
  s+='<text x="'+x(0)+'" y="'+(H-6)+'" text-anchor="start" font-size="9" fill="var(--muted)" font-family="Figtree,sans-serif">'+fmtShort(pts[0].d)+'</text>';
  if(pts.length>1)s+='<text x="'+x(pts.length-1)+'" y="'+(H-6)+'" text-anchor="end" font-size="9" fill="var(--muted)" font-family="Figtree,sans-serif">'+fmtShort(lp.d)+'</text>';
  return s+'</svg>';
}

/* ---------- Alarmas nativas (app de Android) ---------- */
const NATIVE=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
const LN=NATIVE&&window.Capacitor.Plugins?window.Capacitor.Plugins.LocalNotifications:null;
let nativeTimer=null;
function rescheduleSoon(){if(!LN)return;clearTimeout(nativeTimer);nativeTimer=setTimeout(scheduleNative,600)}
async function scheduleNative(){
  if(!LN)return;
  try{
    let perm=await LN.checkPermissions();
    if(perm.display!=='granted')perm=await LN.requestPermissions();
    UI.nPerm=perm.display;if(perm.display!=='granted'){if(UI.tab==='alarmas')renderAlarmas();return}
    try{await LN.createChannel({id:'alarmas',name:'Alarmas de la rutina',description:'Avisos de cada tarea',importance:5,visibility:1,vibration:true})}catch(e){}
    try{const ex=await LN.checkExactNotificationSetting();UI.nExact=ex.exact_alarm}catch(e){UI.nExact=null}
    const pend=await LN.getPending();
    if(pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
    const list=[];
    for(let d=0;d<7;d++){const ref=nextDateWithDow(d);tasksFor(ref).forEach((t,i)=>{if(!t.alarm)return;const [hh,mm]=t.time.split(':').map(Number);
      list.push({id:(d+1)*100+i,title:t.time+' · '+t.title.replace(/ · mes \d/,''),body:t.detail||'',channelId:'alarmas',schedule:{on:{weekday:d+1,hour:hh,minute:mm},allowWhileIdle:true}})})}
    await LN.schedule({notifications:list});
    UI.nCount=list.length;UI.nErr=null;
  }catch(e){UI.nErr=String(e&&e.message||e)}
  if(UI.tab==='alarmas')renderAlarmas();
}

  else if(a==='openDay'){UI.date=b.dataset.d;UI.tab='hoy';UI.gymDow=null;closeKegel();render();window.scrollTo(0,0)}

  else if(t.id==='chartEx'){UI.chartEx=t.value;renderProgreso()}
});

/* ---------- Kegel guiado ---------- */
const KG_TEXT={
  1:{title:'Mes 1 · conexión',steps:['Acostado boca arriba, rodillas dobladas.','Inspirá inflando el abdomen.','Al exhalar por la boca, empujá suave hacia afuera, como para acelerar la orina: el periné baja y se abre.','Sin apretar abdomen ni glúteos y sin pujar fuerte. Sostené 3 s.']},
  2:{title:'Mes 2 · resistencia sentado',steps:['Sentado en una silla firme.','10 Kegels inversos sosteniendo 5 s.','Después 5 Kegels clásicos rápidos de 1 s, hacia adentro.','Repetí la tanda hasta completar los 8 min.']},
  3:{title:'Mes 3 · simulación dinámica',steps:['De pie o en las posiciones que usás, 10 min los días de práctica.','Llegá a nivel 7–8 de excitación y frená el estímulo.','Exhalá profundo con Kegel inverso hasta bajar a 4.','Tres veces antes de acabar. El empuje es siempre suave.']}
};
function kegelPhases(m){
  const ph=[];
  if(m===1){while(ph.reduce((s,p)=>s+p.s,0)<300){for(let i=0;i<10;i++){ph.push({t:'Empujá',sub:'Exhalá y abrí suave · '+(i+1)+'/10',s:3});ph.push({t:'Soltá',sub:'Inspirá inflando el abdomen',s:3})}}}
  else{while(ph.reduce((s,p)=>s+p.s,0)<480){for(let i=0;i<10;i++){ph.push({t:'Empujá',sub:'Inverso, sostené · '+(i+1)+'/10',s:5});ph.push({t:'Soltá',sub:'Inspirá',s:4})}for(let i=0;i<5;i++){ph.push({t:'Apretá',sub:'Clásico rápido · '+(i+1)+'/5',s:1});ph.push({t:'Soltá',sub:'',s:1})}ph.push({t:'Respirá',sub:'Pausa antes de la próxima tanda',s:6})}}
  return ph;
}
function openKegel(m){
  const k=KG_TEXT[m],timed=m<3;
  UI.kegel={m,ph:timed?kegelPhases(m):[],i:0,left:0,run:false,total:timed?(m===1?300:480):0,el:0};
  let h='<div class="sheet" role="dialog" aria-label="Kegel inverso"><div class="sheet-head"><h2>'+k.title+'</h2><button class="iconbtn" data-act="closeModal" aria-label="Cerrar">✕</button></div>';
  if(timed)h+='<div class="kg-phase" id="kgP">Listo</div><div class="kg-sub" id="kgS">'+(m===1?'5':'8')+' minutos guiados</div><div class="kg-count num" id="kgC">'+(m===1?'5:00':'8:00')+'</div><div class="bar" style="--c:var(--a-kegel)"><i id="kgB" style="width:0%"></i></div><button class="btn primary wide" data-act="kgStart" id="kgBtn">Empezar</button>';
  h+='<div class="kg-steps">'+k.steps.map((s,i)=>'<div>'+(i+1)+'. '+s+'</div>').join('')+'<div>Si aparece dolor o no lográs aislar el músculo, consultá a un kinesiólogo de piso pélvico.</div></div><button class="btn wide" data-act="kgDone">Marcar como hecho</button></div>';
  const md=$('#modal');md.innerHTML=h;md.hidden=false;
}
function kegelToggle(){const k=UI.kegel;k.run=!k.run;$('#kgBtn').textContent=k.run?'Pausar':'Seguir';if(k.run){if(!k.left)k.left=k.ph[0].s;showPhase();k.tick=setInterval(kegelTick,1000);try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>k.lock=l).catch(()=>{})}catch(e){}}else clearInterval(k.tick)}
function showPhase(){const k=UI.kegel,p=k.ph[k.i];$('#kgP').textContent=p.t;$('#kgS').textContent=p.sub}
function kegelTick(){
  const k=UI.kegel;k.left--;k.el++;
  const rem=Math.max(0,k.total-k.el);$('#kgC').textContent=Math.floor(rem/60)+':'+pad(rem%60);$('#kgB').style.width=Math.min(100,k.el/k.total*100)+'%';
  if(k.el>=k.total){clearInterval(k.tick);$('#kgP').textContent='Listo';$('#kgS').textContent='Terminaste. Marcalo como hecho.';$('#kgBtn').hidden=true;vibrate([200,100,200]);return}
  if(k.left<=0){k.i=(k.i+1)%k.ph.length;k.left=k.ph[k.i].s;showPhase();vibrate(30)}
}
function closeKegel(){const k=UI.kegel;if(k){clearInterval(k.tick);try{k.lock&&k.lock.release()}catch(e){}}UI.kegel=null;$('#modal').hidden=true;$('#modal').innerHTML=''}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeKegel()});

/* ---------- Calendario .ics ---------- */
function downloadICS(){
  const groups={};
  for(let d=0;d<7;d++){
    const ref=nextDateWithDow(d);
    tasksFor(ref).forEach(t=>{
      if(!t.alarm)return;
      if(t.kegel){[1,2,3].forEach(m=>{const k='kegel|'+KEGEL_INFO[m].time+'|'+m;groups[k]=groups[k]||{title:'Kegel inverso · mes '+m,detail:KEGEL_INFO[m].where,time:(S.ov['kegel:'+d]||KEGEL_INFO[m].time),days:[],m};groups[k].days.push(d)});return}
      const k=t.title+'|'+t.time;groups[k]=groups[k]||{title:t.title,detail:t.detail,time:t.time,days:[]};groups[k].days.push(d);
    });
  }
  const BY=['SU','MO','TU','WE','TH','FR','SA'];
  const start=today()>PLAN.start?today():PLAN.start;
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  let out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Rutina Ricky//ES','CALSCALE:GREGORIAN'];let n=0;
  for(const k in groups){
    const g=groups[k];let from=start,until='20261227T235959';
    if(g.m){const r=[['2026-10-05','2026-11-01'],['2026-11-02','2026-11-29'],['2026-11-30','2026-12-27']][g.m-1];if(r[1]<start)continue;from=r[0]>start?r[0]:start;until=r[1].replace(/-/g,'')+'T235959'}
    let d0=from;for(let i=0;i<7&&!g.days.includes(dow(d0));i++)d0=addDays(d0,1);
    const dt=d0.replace(/-/g,'')+'T'+g.time.replace(':','')+'00';
    out.push('BEGIN:VEVENT','UID:rr-'+(n++)+'-'+stamp+'@rutina-ricky','DTSTAMP:'+stamp,'DTSTART:'+dt,'DURATION:PT15M','RRULE:FREQ=WEEKLY;BYDAY='+g.days.map(x=>BY[x]).join(',')+';UNTIL='+until,'SUMMARY:'+g.title.replace(/[,;]/g,'\\$&'),'DESCRIPTION:'+(g.detail||'').replace(/[,;]/g,'\\$&'),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+g.title.replace(/[,;]/g,'\\$&'),'TRIGGER:PT0M','END:VALARM','END:VEVENT');
  }
  out.push('END:VCALENDAR');
  try{const blob=new Blob([out.join('\r\n')],{type:'text/calendar'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rutina-ricky-alarmas.ics';document.body.appendChild(a);a.click();a.remove();toast('Abrí el archivo para sumarlo al calendario')}catch(e){toast('Esto funciona desde la app instalada')}
}

/* ---------- Avisos a la hora ---------- */
let swReg=null;
function notify(title,body){
  toast(title);vibrate([300,120,300]);
  if(notifState()!=='granted')return;
  try{if(swReg)swReg.showNotification(title,{body,tag:title,icon:'icon-192.png',badge:'icon-192.png'});else new Notification(title,{body})}catch(e){}
}
function checkAlarms(){
  if(NATIVE)return;
  const ds=today(),hm=nowHM();
  tasksFor(ds).forEach(t=>{const k=ds+':'+t.id;if(t.alarm&&t.time===hm&&!S.notified[k]&&!isDone(ds,t.id)){S.notified[k]=1;notify(t.time+' · '+t.title,t.detail||'');save()}});
  for(const k in S.notified)if(k<addDays(ds,-2))delete S.notified[k];
}
setInterval(()=>{checkAlarms();if(UI.tab==='hoy'&&UI.date===today()&&!document.hidden)renderHoy()},20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkAlarms();render()}});

/* ---------- Festejo ---------- */
function confetti(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=$('#fx'),x=c.getContext('2d'),dpr=window.devicePixelRatio||1;c.width=innerWidth*dpr;c.height=innerHeight*dpr;x.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement),cols=['--a-fuerza','--a-cardio','--a-comida','--a-kegel','--gold'].map(v=>cs.getPropertyValue(v).trim());
  const P=Array.from({length:110},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*11-3,r:Math.random()*6+3,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6}));
  const t0=performance.now();
  (function f(t){const dt=t-t0;x.clearRect(0,0,innerWidth,innerHeight);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.globalAlpha=Math.max(0,1-dt/1800);x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});if(dt<1800)requestAnimationFrame(f);else x.clearRect(0,0,innerWidth,innerHeight)})(t0);
}

/* ---------- App instalable ---------- */
try{if(!NATIVE&&'serviceWorker' in navigator&&document.querySelector('link[rel=manifest]')){navigator.serviceWorker.register('sw.js').then(r=>{swReg=r}).catch(()=>{})}}catch(e){}

render();checkAlarms();scheduleNative();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&NATIVE&&UI.tab==='alarmas')renderAlarmas()});
})();
</script>
